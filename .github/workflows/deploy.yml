name: Deploy alterawallet.com

# Every push to main ships to the self-hosted prod server; "Run workflow"
# redeploys on demand. The server builds whatever main is at that moment.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A merge landing mid-deploy queues behind it rather
# than cancelling it; the queued run then builds the newer main.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deploy:
    needs: test
    # Forks that carry this file must never try to reach the server.
    if: github.repository == 'vsc-eco/altera-app'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is pinned server-side to a forced command that accepts only
          # "deploy" or "status", and the server pulls main itself, so this
          # job cannot ship anything that isn't already on main.
          ssh -p "${PORT:-22}" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "altera-deploy@$HOST" deploy
