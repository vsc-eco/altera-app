query GetTransactions(
	$did: String
	$limit: Int
	$offset: Int
	$byType: [String!]
) {
	# NOTE: byLedgerToFrom is intentionally omitted — mainnet nodes (main /
	# b10d0fab) do not define it on TransactionFilter, so including it fails the
	# whole query with GRAPHQL_VALIDATION_FAILED and the page shows nothing.
	# Re-add it (and the $byLedgerToFrom variable) once mainnet nodes ship it.
	# The address filter still works client-side (see filters.ts).
	findTransaction(
		filterOptions: {
			limit: $limit
			offset: $offset
			byAccount: $did
			byType: $byType
		}
	) @paginate {
		anchr_height
		anchr_ts
		first_seen
		id
		ledger {
			amount
			asset
			from
			memo
			to
			type
		}
		ops {
			data
			index
			type
		}
		output {
			id
			index
		}
		status
		type
	}
}
